name: Android APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Gradle 8.9
        run: |
          curl --fail --location --silent --show-error https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
      - run: gradle --version
      - name: Build debug APK
        env:
          SUPABASE_URL_2: ${{ secrets.SUPABASE_URL_2 }}
          SUPABASE_PUBLISHABLE_KEY_2: ${{ secrets.SUPABASE_PUBLISHABLE_KEY_2 }}
        run: |
          test -n "$SUPABASE_URL_2" || (echo "Missing GitHub secret SUPABASE_URL_2" && exit 1)
          test -n "$SUPABASE_PUBLISHABLE_KEY_2" || (echo "Missing GitHub secret SUPABASE_PUBLISHABLE_KEY_2" && exit 1)
          gradle assembleDebug --stacktrace \
            -PsupabaseUrl="$SUPABASE_URL_2" \
            -PsupabasePublishableKey="$SUPABASE_PUBLISHABLE_KEY_2"
      - uses: actions/upload-artifact@v4
        with:
          name: l-rewards-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
